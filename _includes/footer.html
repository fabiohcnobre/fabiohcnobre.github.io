{% assign footer = data.footer %} 
<footer class="footer">
    <p>
        <i class="fas fa-brands fa-creative-commons"></i>
        {{site.username}} - <img src="/assets/img/favicon.ico" alt="Logo" /> - {{footer.update}} {{ site.time | date: '%m/%Y' }}
        &nbsp;|&nbsp;
        <a href="https://github.com/fabiohcnobre/fabiohcnobre.github.io/issues">{{footer.issue}}</a>
        &nbsp;|&nbsp;
        {{footer.title}}<span class="love">❤</span> {{footer.subtitle}}
    </p>
</footer>
